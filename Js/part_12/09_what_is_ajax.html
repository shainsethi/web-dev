<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What is Ajax</title>
</head>
<body>
  <h1>Ajax Example</h1>
  <p>This page gets new data without reloading.</p>
  <button id="load">Get a cat fact</button>
  <p id="status" role="status"></p>
  <p id="fact"></p>
  <script>
    const loadButton = document.querySelector("#load");
    const statusText = document.querySelector("#status");
    const factText = document.querySelector("#fact");

    loadButton.addEventListener("click", async () => {
      loadButton.disabled = true;
      statusText.textContent = "Loading...";

      try {
        const response = await fetch("https://catfact.ninja/fact");

        if (!response.ok) {
          throw new Error(`Status ${response.status}`);
        }

        const data = await response.json();

        factText.textContent = data.fact;
        statusText.textContent = "Loaded";
      } catch (error) {
        statusText.textContent = `Could not load the fact: ${error.message}`;
      } finally {
        loadButton.disabled = false;
      }
    });
  </script>
</body>
</html>
