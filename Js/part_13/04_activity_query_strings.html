<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Search</title>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
</head>
<body>
  <h1>Book Search</h1>
  <form id="searchForm">
    <label for="query">Book title:</label>
    <input id="query" type="text">
    <button id="searchButton">Search</button>
  </form>
  <p id="status" role="status"></p>
  <ul id="results"></ul>
  <script>
    const form = document.querySelector("#searchForm");
    const queryInput = document.querySelector("#query");
    const searchButton = document.querySelector("#searchButton");
    const statusText = document.querySelector("#status");
    const results = document.querySelector("#results");

    async function searchBooks(query) {
      const config = {
        params: {
          q: query,
          limit: 5,
          fields: "title,author_name,first_publish_year",
        },
      };
      const response = await axios.get("https://openlibrary.org/search.json", config);

      return response.data.docs;
    }

    function showBooks(books) {
      results.innerHTML = "";

      for (let book of books) {
        const item = document.createElement("li");
        const author = book.author_name ? book.author_name[0] : "Unknown author";
        const year = book.first_publish_year || "Unknown year";

        item.textContent = `${book.title} by ${author} (${year})`;
        results.append(item);
      }
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();

      const query = queryInput.value.trim();

      results.innerHTML = "";

      if (query === "") {
        statusText.textContent = "Please enter a book title";
        return;
      }

      searchButton.disabled = true;
      statusText.textContent = "Searching...";

      try {
        const books = await searchBooks(query);

        showBooks(books);
        statusText.textContent = books.length > 0 ? `Showing ${books.length} results` : "No books found";
      } catch (error) {
        statusText.textContent = `Search failed: ${error.message}`;
      } finally {
        searchButton.disabled = false;
      }
    });
  </script>
</body>
</html>
