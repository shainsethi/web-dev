<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block vs Inline</title>
</head>
<body>
    <!-- Block level containers start on new lines -->
    <div style="background-color: lightblue; padding: 10px;">
        <p>This is a block-level paragraph inside a block-level div container.</p>
    </div>

    <!-- Inline elements occupy only content width and do not break lines -->
    <p>
        This is a paragraph containing 
        <span style="background-color: lightgreen; padding: 2px;">inline span text</span>, 
        a <strong>bold strong tag</strong>, and an 
        <a href="#">inline link tag</a>.
    </p>
</body>
</html>
