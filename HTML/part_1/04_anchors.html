<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links & Anchors</title>
</head>
<body>
    <h2>External Links</h2>
    <p><a href="https://example.com" target="_blank" title="Open Example">Visit Example.com (New Tab)</a></p>
    <p><a href="#footer-section">Jump to Footer Bookmark</a></p>

    <div style="height: 1000px; background-color: #f1f1f1; padding: 20px;">
        <p>Scroll down or click the link above...</p>
    </div>

    <h2 id="footer-section">Footer Section Target</h2>
    <p>You arrived at the bookmarked section!</p>
</body>
</html>
