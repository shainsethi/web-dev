<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Including CSS</title>
    <!-- Internal CSS -->
    <style>
        h2 {
            color: green;
        }
    </style>
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Inline CSS -->
    <h1 style="color: blue; text-align: center;">Inline CSS Title</h1>
    
    <h2>Internal CSS Subtitle</h2>
    
    <p>External CSS Paragraph</p>
</body>
</html>
