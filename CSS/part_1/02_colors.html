<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors in CSS</title>
    <style>
        .hex-box {
            background-color: #ff5733;
            color: #ffffff;
        }
        .rgb-box {
            background-color: rgb(33, 150, 243);
            color: rgba(255, 255, 255, 0.9);
        }
        .hsl-box {
            background-color: hsl(120, 60%, 40%);
            color: hsl(0, 0%, 100%);
        }
    </style>
</head>
<body>
    <div class="hex-box">HEX Color Box</div>
    <br>
    <div class="rgb-box">RGB Color Box</div>
    <br>
    <div class="hsl-box">HSL Color Box</div>
</body>
</html>
