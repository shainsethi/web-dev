<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Smiley Face Drawing</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #e0e8f5;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .canvas {
            text-align: center;
        }

        .face {
            position: relative;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #ffe066 30%, #f5b041 100%);
            border: 8px solid #2c3e50;
            border-radius: 50%;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            margin-bottom: 20px;
        }

        .eye {
            position: absolute;
            top: 85px;
            width: 35px;
            height: 50px;
            background-color: #2c3e50;
            border-radius: 50%;
        }

        .eye-left {
            left: 70px;
        }

        .eye-right {
            right: 70px;
        }

        .pupil {
            position: absolute;
            top: 8px;
            left: 8px;
            width: 12px;
            height: 12px;
            background-color: #ffffff;
            border-radius: 50%;
        }

        .rosy-cheek {
            position: absolute;
            top: 145px;
            width: 45px;
            height: 25px;
            background-color: #ec7063;
            border-radius: 50%;
            opacity: 0.6;
        }

        .cheek-left {
            left: 45px;
        }

        .cheek-right {
            right: 45px;
        }

        .mouth {
            position: absolute;
            top: 110px;
            left: 75px;
            width: 150px;
            height: 120px;
            border-bottom: 10px solid #2c3e50;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="canvas">
        <div class="face">
            <div class="eye eye-left">
                <div class="pupil"></div>
            </div>
            <div class="eye eye-right">
                <div class="pupil"></div>
            </div>
            <div class="rosy-cheek cheek-left"></div>
            <div class="rosy-cheek cheek-right"></div>
            <div class="mouth"></div>
        </div>
        <h2>Pure CSS Smiley Face</h2>
    </div>
</body>
</html>
